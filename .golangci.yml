version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - goconst
    - gosec
    - makezero
    - misspell
    - musttag
    - nilerr
    - nilnil
    - noctx
    - predeclared
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usetesting

  settings:
    # A switch over one of our state or enum types that forgets a case is exactly
    # the kind of silent gap this project cannot afford, so a missing member is an
    # error even when a default branch exists.
    exhaustive:
      default-signifies-exhaustive: false

    forbidigo:
      forbid:
        # Waiting on wall-clock time makes a test slow and flaky, and the engine
        # specs require an injected clock precisely so that time can be controlled.
        - pattern: ^time\.Sleep$
          msg: use an injected clock or synchronise on a channel instead of sleeping
        # Diagnostics go through the structured logger so that they carry engine
        # context and can be redacted; a bare print bypasses both.
        - pattern: ^fmt\.Print(f|ln)?$
          msg: use log/slog instead of printing to stdout

    depguard:
      rules:
        # Decision logic must stay pure: no storage, no event bus, no network.
        # Enforced by lint because the split between decision and I/O is what
        # makes the state machine testable without containers.
        pure-logic:
          files:
            - "**/internal/sentinel/logic.go"
            - "**/internal/sentinel/forkpoint.go"
            - "**/internal/sentinel/cadence.go"
          deny:
            - pkg: net
              desc: decision logic must not perform I/O
            - pkg: net/http
              desc: decision logic must not perform I/O
            - pkg: database/sql
              desc: decision logic must not touch storage
            - pkg: github.com/paulscode/forktower/internal/store
              desc: decision logic must not touch storage
            - pkg: github.com/paulscode/forktower/internal/bus
              desc: decision logic must not publish events

        # The block scanner is held to the same bar as the decision logic, and for
        # a sharper reason: it is the thing that decides whether a spend of a
        # user's channel was noticed. A scanner that could read the database
        # would be a scanner whose answer depends on when it ran, and the crafted
        # blocks it is tested against would stop proving anything about the real
        # one. The watchset is built elsewhere and handed in.
        pure-scan:
          files:
            - "**/internal/watcher/scan.go"
          deny:
            - pkg: net
              desc: the block scanner must not perform I/O
            - pkg: net/http
              desc: the block scanner must not perform I/O
            - pkg: os
              desc: the block scanner must not touch the filesystem
            - pkg: database/sql
              desc: the block scanner must not touch storage
            - pkg: github.com/paulscode/forktower/internal/store
              desc: the block scanner is given its watchset, it does not read one
            - pkg: github.com/paulscode/forktower/internal/bus
              desc: the block scanner returns what it found, it does not publish it

        # The shape classifier decides what a transaction on the other chain was:
        # a cooperative close, somebody's commitment, or a justice transaction
        # landing. Same "no I/O" bar as the scanner, with the store allowed for
        # its vocabulary of shapes and roles — denying it would force a parallel
        # copy of both enums whose only purpose would be to be converted back,
        # which is a second place to forget a case.
        pure-shape:
          files:
            - "**/internal/watcher/classify.go"
          deny:
            - pkg: net
              desc: the shape classifier must not perform I/O
            - pkg: net/http
              desc: the shape classifier must not perform I/O
            - pkg: os
              desc: the shape classifier must not touch the filesystem
            - pkg: database/sql
              desc: the shape classifier must not touch storage
            - pkg: github.com/paulscode/forktower/internal/bus
              desc: the shape classifier returns a verdict, it does not publish one

        # The deadline computation decides when somebody loses money. Same bar as
        # the scanner and the shape classifier, with the store allowed for its
        # vocabulary of kinds and shapes.
        pure-deadline:
          files:
            - "**/internal/deadline/compute.go"
          deny:
            - pkg: net
              desc: the deadline computation must not perform I/O
            - pkg: net/http
              desc: the deadline computation must not perform I/O
            - pkg: os
              desc: the deadline computation must not touch the filesystem
            - pkg: database/sql
              desc: the deadline computation must not touch storage
            - pkg: github.com/paulscode/forktower/internal/bus
              desc: the deadline computation returns clocks, it does not publish them

        # Which of the user's transactions get copied onto the other chain. The
        # one decision in this program that can *create* exposure rather than
        # observe it, so it is held to the same "no I/O" bar as the rest and
        # allowed the store only for its vocabulary of shapes and branches.
        # Whoever controls the anchor list controls who the second node peers
        # with on the chain it is defending, so the code that decides whether to
        # trust a list must be answerable by reading it. In particular it must
        # never be able to fetch one: a daemon that downloads its own
        # configuration has configuration belonging to whoever holds the other
        # end, and that is the rule this package exists to keep.
        pure-anchors:
          files:
            - "**/internal/anchors/list.go"
            - "**/internal/anchors/verify.go"
          deny:
            - pkg: net
              desc: >-
                anchor lists arrive by app update or by the user importing a
                file, never over the network
            - pkg: net/http
              desc: >-
                anchor lists arrive by app update or by the user importing a
                file, never over the network
            - pkg: os
              desc: the list rules take bytes; reading files is the caller's job
            - pkg: database/sql
              desc: the list rules must not touch storage
            - pkg: time
              desc: >-
                a list is accepted on its signature and its version, never on
                what time it is

        pure-policy-mirror:
          files:
            - "**/internal/responder/mirror/policy.go"
          deny:
            - pkg: net
              desc: the mirror policy must not perform I/O
            - pkg: net/http
              desc: the mirror policy must not perform I/O
            - pkg: os
              desc: the mirror policy must not touch the filesystem
            - pkg: database/sql
              desc: the mirror policy must not touch storage
            - pkg: time
              desc: >-
                the mirror policy must not read a clock; the same transaction
                must get the same answer whenever it is asked about
            - pkg: github.com/paulscode/forktower/internal/bus
              desc: the mirror policy returns a verdict, it does not publish one

        # Whether a tower covers a channel decides whether a user is told their
        # money is protected. Same "no I/O" bar as the scanner and the shape
        # classifier, with the store allowed for its vocabulary of channel types.
        pure-coverage:
          files:
            - "**/internal/responder/tower/coverage.go"
          deny:
            - pkg: net
              desc: the coverage check must not perform I/O
            - pkg: net/http
              desc: the coverage check must not perform I/O
            - pkg: os
              desc: the coverage check must not touch the filesystem
            - pkg: database/sql
              desc: the coverage check must not touch storage
            - pkg: time
              desc: >-
                the coverage check is given how long a tower has been registered,
                it does not read a clock
            - pkg: github.com/paulscode/forktower/internal/bus
              desc: the coverage check returns a verdict, it does not publish one

        # The alerting policy is held to the same "no I/O" bar, but with a
        # narrower deny list. It maps bus events onto the store's alert
        # vocabulary, so denying those two packages would force a parallel copy
        # of every event type and of the tier enum whose only purpose would be to
        # be converted back — a second place to forget a case, which is the exact
        # failure this project cannot afford. What matters is that the mapping
        # performs no I/O, and that is what is denied.
        pure-policy:
          files:
            - "**/internal/alert/policy.go"
            - "**/internal/alert/scrub.go"
          deny:
            - pkg: net
              desc: the alerting policy must not perform I/O
            - pkg: net/http
              desc: the alerting policy must not perform I/O
            - pkg: net/smtp
              desc: the alerting policy must not perform I/O
            - pkg: os
              desc: the alerting policy must not touch the filesystem
            - pkg: database/sql
              desc: the alerting policy must not touch storage
    revive:
      rules:
        - name: exported
          disabled: false

    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - ifElseChain

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - noctx
          # Test tables repeat the exact strings a user is promised in the
          # documentation. Hoisting those into constants would hide the thing the
          # test exists to pin down.
          - goconst
          # Tests deliberately create over-permissive files to prove the warning
          # about them fires.
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/paulscode/forktower

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
