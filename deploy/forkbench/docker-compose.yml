name: forkbench

# Two Bitcoin nodes that can be made to disagree on demand.
#
# `sf-node` stands in for the chain the user's own node follows, and `sq-node`
# for the chain it does not. Both are ordinary regtest Core: the divergence is
# produced by `forkbench split`, which makes one node reject a block the other
# accepted, rather than by running different software. That is deliberate — the
# point is to exercise Forktower against two chains that genuinely disagree, and
# using stock Core keeps this world reproducible for anyone.
#
# RPC is bound to the loopback address only. This is a test world holding no real
# money, but a Bitcoin RPC port reachable from the network is a bad habit to
# demonstrate.

services:
  sf-node:
    image: lncm/bitcoind:v28.0
    restart: unless-stopped
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=forkbench
      - -rpcpassword=forkbench
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18443
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
      - -printtoconsole=1
      # Deliberately not -connect: that would make the node talk to nothing else,
      # and forkbench needs to be able to reconnect them.
      - -listen=1
      - -bind=0.0.0.0:18445
    volumes:
      - sf-data:/data/.bitcoin
    ports:
      - "127.0.0.1:18443:18443"
      - "127.0.0.1:28332:28332"
      - "127.0.0.1:28333:28333"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bitcoin-cli -regtest -rpcuser=forkbench -rpcpassword=forkbench
          -rpcconnect=127.0.0.1 -rpcport=18443 getblockchaininfo >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - forkbench

  sq-node:
    image: lncm/bitcoind:v28.0
    restart: unless-stopped
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=forkbench
      - -rpcpassword=forkbench
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18443
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
      - -printtoconsole=1
      - -listen=1
      - -bind=0.0.0.0:18445
    volumes:
      - sq-data:/data/.bitcoin
    ports:
      - "127.0.0.1:18444:18443"
      - "127.0.0.1:28342:28332"
      - "127.0.0.1:28343:28333"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bitcoin-cli -regtest -rpcuser=forkbench -rpcpassword=forkbench
          -rpcconnect=127.0.0.1 -rpcport=18443 getblockchaininfo >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - forkbench

  # Two Lightning nodes, both on the chain the user's own node follows.
  #
  # `lnd-user` is the node Forktower is protecting. `lnd-mallory` is the
  # counterparty, and it is called that because its whole purpose is to be
  # rolled back to an old channel state and made to publish a commitment it has
  # already promised not to. That is the attack this software exists to notice,
  # and there is no honest way to demonstrate it without staging it.
  #
  # --noseedbackup means no wallet passphrase and no seed to keep: exactly what
  # nobody should ever do with real money, and exactly right for a regtest world
  # that is deleted after every run. --nolisten is not set, because the two need
  # to reach each other to open a channel at all.
  lnd-user:
    image: lightninglabs/lnd:v0.18.5-beta
    restart: unless-stopped
    depends_on:
      sf-node:
        condition: service_healthy
    command:
      - lnd
      - --noseedbackup
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=sf-node:18443
      - --bitcoind.rpcuser=forkbench
      - --bitcoind.rpcpass=forkbench
      - --bitcoind.zmqpubrawblock=tcp://sf-node:28332
      - --bitcoind.zmqpubrawtx=tcp://sf-node:28333
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --listen=0.0.0.0:9735
      - --tlsextradomain=lnd-user
      - --alias=user
      - --trickledelay=50
      - --debuglevel=info
      # Confirming a channel in one block keeps the demonstrations short. Nothing
      # about Forktower depends on the number, and waiting three blocks for every
      # step of a scripted scenario is time nobody gets back.
      - --bitcoin.defaultchanconfs=1
      - --maxpendingchannels=10
      # The watchtower client, which is a configuration setting rather than
      # something that can be switched on at runtime — the single largest
      # onboarding obstacle for a real user, and the reason a scenario has to
      # bake it in rather than turn it on when it needs it.
      - --wtclient.active
    volumes:
      - lnd-user-data:/root/.lnd
    ports:
      - "127.0.0.1:10009:10009"
      - "127.0.0.1:8081:8080"
    networks:
      - forkbench

  lnd-mallory:
    image: lightninglabs/lnd:v0.18.5-beta
    restart: unless-stopped
    depends_on:
      sf-node:
        condition: service_healthy
    command:
      - lnd
      - --noseedbackup
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=sf-node:18443
      - --bitcoind.rpcuser=forkbench
      - --bitcoind.rpcpass=forkbench
      - --bitcoind.zmqpubrawblock=tcp://sf-node:28332
      - --bitcoind.zmqpubrawtx=tcp://sf-node:28333
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --listen=0.0.0.0:9735
      - --tlsextradomain=lnd-mallory
      - --alias=mallory
      - --trickledelay=50
      - --debuglevel=info
      - --bitcoin.defaultchanconfs=1
      - --maxpendingchannels=10
    volumes:
      - lnd-mallory-data:/root/.lnd
      # Where a saved channel state is kept. Its own volume, so that saving it
      # does not mean writing a copy of the channel database into the directory
      # being copied — and so `forkbench down` takes it away with everything else.
      - lnd-mallory-snapshot:/snapshot
    ports:
      - "127.0.0.1:10010:10009"
      - "127.0.0.1:8082:8080"
    networks:
      - forkbench

# Named volumes rather than bind mounts: `forkbench down` removes them, and a
# world that cannot be wiped cleanly is a world that accumulates the state of
# every experiment anyone has ever run in it.
  # The companion watchtower, watching the chain the user's own node does not.
  #
  # Its backend is sq-node deliberately: that is where a breach would be
  # published in these scenarios, and a tower whose view is the same chain as
  # the victim's node would be watching the wrong place entirely.
  #
  # Behind a profile, because most scenarios do not need it and starting an
  # extra LND costs a minute nobody is spending on purpose.
  tower:
    image: lightninglabs/lnd:v0.18.5-beta
    profiles: ["tower"]
    depends_on:
      sq-node:
        condition: service_healthy
    command:
      - lnd
      - --noseedbackup
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=sq-node:18443
      - --bitcoind.rpcuser=forkbench
      - --bitcoind.rpcpass=forkbench
      - --bitcoind.zmqpubrawblock=tcp://sq-node:28332
      - --bitcoind.zmqpubrawtx=tcp://sq-node:28333
      - --restlisten=0.0.0.0:8080
      - --rpclisten=0.0.0.0:10009
      # No channels of its own, so no reason to accept peer connections.
      - --nolisten
      - --tlsextradomain=tower
      - --alias=tower
      - --debuglevel=info,WTWR=debug
      - --watchtower.active
      - --watchtower.listen=0.0.0.0:9911
      - --watchtower.externalip=tower:9911
    ports:
      # So a Forktower running on the host can ask the tower how it is doing.
      - "127.0.0.1:8083:8080"
    volumes:
      - tower-data:/root/.lnd
    networks:
      - forkbench

volumes:
  sf-data:
  sq-data:
  lnd-user-data:
  lnd-mallory-data:
  lnd-mallory-snapshot:
  tower-data:

networks:
  forkbench:
