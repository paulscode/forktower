# Forktower against the forkbench world.
#
# For development only. The credentials below match the compose file, which is a
# throwaway regtest world with no money in it — a real deployment reads its
# node's cookie file instead of carrying a password here.

[sf]
rpc_url = "http://127.0.0.1:18443"
rpc_user = "forkbench"
rpc_pass = "forkbench"
zmq_rawblock = "tcp://127.0.0.1:28332"
zmq_rawtx = "tcp://127.0.0.1:28333"

[sq.bitcoind]
rpc_url = "http://127.0.0.1:18444"
rpc_user = "forkbench"
rpc_pass = "forkbench"
zmq_rawblock = "tcp://127.0.0.1:28342"
zmq_rawtx = "tcp://127.0.0.1:28343"

# The Lightning node forkbench builds. Its certificate and a read-only macaroon
# have to be copied out of the container first:
#
#     forkbench ln-credentials -ln-node user -out deploy/forkbench/creds
#
# They are not committed — they belong to a world that is rebuilt from nothing
# every time — so this section does nothing until that has been run, and the
# dashboard says so plainly rather than pretending.
[[ln.lnd]]
rest_addr = "https://127.0.0.1:8081"
tls_cert_path = "deploy/forkbench/creds/user/tls.cert"
macaroon_path = "deploy/forkbench/creds/user/readonly.macaroon"

[sentinel]
# Faster than the shipped defaults, because a development loop measured in
# minutes is a development loop nobody runs.
poll_interval_secs = 2
split_confirm_depth = 2

[store]
path = ".dev/forktower.db"

[ui]
listen = "127.0.0.1:8330"
auth = "none"

[log]
level = "debug"
