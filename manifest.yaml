id: forktower
title: "Forktower"
version: 0.6.5
release-notes: "Forktower no longer watches the other chain until that chain's node has caught up. On a fresh install the second Bitcoin node is still doing its initial sync, and Forktower was taking its position in that sync as a starting point and following the download forward — scanning blocks from years before any of your channels existed, competing for disk with the sync itself, and raising an urgent 'scanning has stopped' alert every time a read hiccupped under the load. Those alerts were also keyed so that one problem became a new urgent alert each time the height moved. Nothing was at risk: during that sync the second node cannot see the other chain anyway. Nothing on the dashboard should have suggested otherwise."
license: MIT
wrapper-repo: "https://github.com/paulscode/forktower"
upstream-repo: "https://github.com/paulscode/forktower"
support-site: "https://github.com/paulscode/forktower/issues"
marketing-site: "https://github.com/paulscode/forktower"
build: ["make"]
description:
  short: "Watches the other chain, so a split does not cost you a channel"
  long: |
    During a contested Bitcoin upgrade the network can separate into two chains.
    Your node follows one of them and is blind to the other — but your Lightning
    channels exist on both, and the timers that protect them keep running on
    both. A node cannot respond to a breach on a chain it cannot see, and cannot
    tell you it is happening.

    Forktower runs a second Bitcoin node following the chain yours does not,
    tells you which of your channels would be exposed and how long you have, and
    can copy your own closing transactions across. It only ever reads from your
    Lightning node: it holds no keys, signs nothing, and cannot move your money.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
main:
  type: docker
  image: main
  entrypoint: "docker_entrypoint_0351.sh"
  args: []
  mounts:
    main: /data
    # The Lightning credentials, read-only — and **only the `public` subdirectory
    # of that volume**. On this platform LND populates `public/` with
    # `readonly.macaroon` and `tls.cert`, which is everything Forktower asks for,
    # while the volume root also holds `start9/cipherSeedMnemonic.txt` and
    # `pwd.dat` — the wallet's seed words and its password, in plain text.
    #
    # Mounting the root, which is the documented pattern and what the sibling
    # packages do, would make a Forktower compromise a node compromise by mount,
    # which no amount of care about macaroons afterwards can undo.
    lnd: /mnt/lnd
    # The Bitcoin node's exported properties, read-only — and **only its
    # `start9` subdirectory**, for the same reason as the mount above.
    #
    # This is where that package publishes its RPC username and password, and it
    # is the only route to them on this platform: there is no cookie file, and
    # nothing injects them into a dependant's environment. Forktower spent a
    # release believing otherwise and could not authenticate at all.
    #
    # Not the volume root, which is the whole chain plus whatever else that
    # package keeps. A credential is what is needed and a credential is what is
    # mounted.
    bitcoind: /mnt/bitcoind
  gpu-acceleration: false
hardware-requirements:
  arch:
    - x86_64
    - aarch64
health-checks:
  dashboard:
    name: "Dashboard"
    success-message: "The dashboard is ready."
    type: docker
    image: main
    system: false
    entrypoint: check-dashboard.sh
    args: []
    mounts: {}
    io-format: json
    inject: true
  chains:
    name: "Both chains"
    success-message: "Both chains are being watched."
    type: docker
    image: main
    system: false
    entrypoint: check-chains.sh
    args: []
    mounts: {}
    io-format: json
    inject: true
config:
  get:
    type: script
  set:
    type: script
properties:
  type: script
volumes:
  main:
    type: data
  lnd:
    type: pointer
    package-id: lnd
    volume-id: main
    # Not "/". See the mount comment above — the difference is the wallet seed.
    path: "/public"
    readonly: true
  bitcoind:
    type: pointer
    package-id: bitcoind
    volume-id: main
    # Not "/". The RPC credentials are published under start9/, and the rest of
    # that volume is several hundred gigabytes of chain this has no use for.
    path: "/start9"
    readonly: true
interfaces:
  main:
    name: "Forktower Dashboard"
    description: "What Forktower can see, and what it means for your channels."
    tor-config:
      port-mapping:
        80: "8330"
    lan-config:
      443:
        ssl: true
        internal: 8330
    ui: true
    protocols:
      - tcp
      - http
  watchtower:
    name: "Watchtower"
    description: "Register this address with your Lightning node so a breach on the other chain gets answered rather than only reported."
    tor-config:
      port-mapping:
        9911: "9911"
    ui: false
    protocols:
      - tcp
dependencies:
  bitcoind:
    version: ">=27.0.0"
    requirement:
      type: "required"
    description: "The Bitcoin node you already run. Forktower reads its chain and compares it against the other one."
    config: ~
  lnd:
    version: ">=0.18.0"
    requirement:
      type: "opt-in"
      how: "Connect your Lightning node so Forktower can tell you which of your channels a split would expose. It only ever reads."
    description: "Your Lightning node, read-only. Without it Forktower still watches both chains."
    config: ~
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /data
    mounts:
      BACKUP: "/mnt/backup"
      main: "/data"
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /data
    mounts:
      BACKUP: "/mnt/backup"
      main: "/data"
migrations:
  from:
    "*":
      type: script
      args: ["from"]
  to:
    "*":
      type: script
      args: ["to"]
