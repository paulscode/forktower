name: CI

# UNVERIFIED DRAFT — this workflow has never executed.
#
# The project is not published yet, so there is no remote and nothing has run
# this. Expect to iterate on it the first time it does. Until then `make check`
# is the real gate and is deliberately a superset of the jobs below, so that
# nothing is waiting on a build server that does not exist.
#
# CI never builds or publishes a release artifact. Release packages are built
# locally and signed on an offline machine.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The scenario suite, nightly. It builds two Bitcoin nodes, two Lightning
    # nodes and a channel per case, so it does not belong on every push — and it
    # is the only thing here that proves the pieces add up rather than each
    # working alone.
    - cron: "0 4 * * *"
permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Fails if any shipped file cites the private planning documents. Runs
      # first because it is instant and catches an easy mistake.
      - name: Documentation boundary
        run: ./scripts/check-boundary.sh

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout=5m

      # A v1-shaped config is not an error to golangci-lint — it is silently
      # partly ignored, which would leave the dependency rules unenforced.
      - name: Verify lint config
        run: golangci-lint config verify

      # `run` does not check formatters; this is the gate that does.
      - name: Formatting
        run: golangci-lint fmt --diff ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  scenarios:
    # Only on the nightly schedule, or when asked for by hand. Several minutes of
    # containers is not something to put in front of every push, and nothing else
    # in this file needs Docker at all.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: The situations this software exists for
        run: make integration
